name: fire_juggle
# fd_juggle (docs/evidence/fire_juggle_overlay): the fire-juggling arrow. On bank with
# the RescueBot off. Following vs frozen is observed, not predicted (D32): the spot
# (+0x3400) is following when it equals the player's position of the previous frame
# (Think's write copies it); otherwise it's frozen, and the arrow points at the landing
# point T = spot - 30 X, relative to the view. Test hooks (Debug only): fd_dbg_setpos /
# fd_dbg_o2 (O2 <= 0.5 is one way the game stops writing) and fd_dbg_tofire (real fire).
# Practice-only (refused under fd_profile run): the gate is profile_run's and keys_default's,
# the declaration docs_registry's.
pre_files:
  - {src: tests/game/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - assert_log: {contains: "module juggle: enabled"}
  - assert_log: {contains: "juggle: ready (fd_juggle)"}
  - console: "fd_watermark 0"
  - console: "fd_rescuebot 0"
  - loadmap: bank
  # off by default
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 0}
  - console: "fd_juggle 1"
  - wait_s: 1
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 1}
  - assert_pipe_stat: {cmd: juggle, key: valid, equals: 1}
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  - assert_pipe_contains: {cmd: juggle, contains: "glyph=- "}
  - screenshot: spawn_following
  # Walking on clean ground: the spot follows on every frame (no freeze while walking).
  - console: "fd_dbg_setpos -697 -47 1196 0"
  - wait_log: {contains: "juggle: setpos -697 -47 1196 (+yaw): ok", since_console: true, timeout: 10}
  - wait_s: 1
  - focus: {}
  - sample_pipe: {cmd: juggle, as: before_walk}
  - sample_mem: {name: player.pos_x, as: walk_x}
  - sample_mem: {name: player.pos_z, as: walk_z}
  - key_down: w
  - wait_s: 0.5
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  - wait_s: 0.5
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  - key_up: w
  - wait_s: 0.5
  - assert_moved: {x: walk_x, z: walk_z, min: 100}
  - assert_pipe_stat: {cmd: juggle, key: locks, equals: 0, since: before_walk}
  # A jump (JUMP = right mouse button): the game doesn't write in the air, and the
  # overlay shows that as it is.
  - sample_pipe: {cmd: juggle, as: before_jump}
  - rclick: {}
  - wait_s: 2
  - assert_pipe_stat: {cmd: juggle, key: locks, min: 1, since: before_jump}
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  - assert_log: {contains: "juggle: frozen"}
  # Glyph set with an exact answer per view. O2 0.1 on clean ground at P: the game stops
  # writing, so the spot stays at P (O2 refills ~0.1/s, so each step sets it again).
  # Standing near P, whether it reads frozen depends on where the player settles (the
  # hook puts them back at y -47 and they drop); the harness decides from memory. Moved
  # 30 u to +X, the player sees T = P - 30 X exactly 60 u to -X; turning the view (yaw
  # set by the hook) must give the computed direction: forward = (sin yaw, cos yaw),
  # right = (-cos yaw, sin yaw).
  - console: "fd_dbg_setpos -697 -47 1196 0"
  - wait_log: {contains: "juggle: setpos -697 -47 1196 (+yaw): ok", since_console: true, timeout: 10}
  - wait_s: 1
  - console: "fd_dbg_setpos -697 -47 1196 0 0.1"
  - wait_log: {contains: "juggle: setpos -697 -47 1196 (+yaw) (+o2): ok", since_console: true, timeout: 10}
  - wait_s: 0.5
  - assert_juggle: {locked: auto}
  - console: "fd_dbg_setpos -667 -47 1196 0 0.1"
  - wait_log: {contains: "juggle: setpos -667 -47 1196 (+yaw) (+o2): ok", since_console: true, timeout: 10}
  # The frame of the move still compares with the old position, so frozen shows a frame
  # later. Poll briefly: O2 refills ~0.1/s, so in ~4 s the game would save again.
  - wait_pipe: {cmd: juggle, key: locked, equals: 1, timeout: 2}
  - wait_s: 0.4
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 1}
  - assert_pipe_stat: {cmd: juggle, key: dir, equals: 2}  # right
  - assert_pipe_stat: {cmd: juggle, key: dist, equals: 600}  # tenths: 60 u
  - screenshot: glyph_yaw000_right
  # Turned 135 degrees: the arrow turns with the view (all eight directions and the sector
  # edges are unit-tested, tests/unit/test_juggle.cpp).
  - console: "fd_dbg_setpos -667 -47 1196 135 0.1"
  - wait_log: {contains: "juggle: setpos -667 -47 1196 (+yaw) (+o2): ok", since_console: true, timeout: 10}
  - wait_s: 0.4
  - assert_pipe_stat: {cmd: juggle, key: dir, equals: 5}  # down-left
  - assert_pipe_stat: {cmd: juggle, key: dist, equals: 600}
  - screenshot: glyph_yaw135_down-left
  - assert_pipe_stat: {cmd: juggle, key: elsewhere, equals: 0}
  - console: "fd_dbg_o2 1"
  - wait_s: 1
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  # Real fire. fd_dbg_tofire (Debug test hook) tries the level's fire nodes until the burn
  # meter rises (fire nodes move along their paths, so fixed coordinates don't reliably
  # burn), burns to the target, then returns to the spawn: clean ground.
  - console: "fd_dbg_setpos -697 -47 1196 0"
  - wait_log: {contains: "juggle: setpos -697 -47 1196 (+yaw): ok", since_console: true, timeout: 10}
  - wait_s: 1
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  - assert_pipe_contains: {cmd: juggle, contains: "glyph=- "}
  - assert_juggle: {locked: 0}
  - console: "fd_dbg_tofire 0.6"
  - wait_log: {contains: "juggle: tofire: done", timeout: 60}
  - assert_log: {contains: "juggle: tofire: node"}
  # back on clean ground: frozen (the spot stayed at the fire), and the arrow agrees with
  # the harness's own computation
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 1}
  - assert_pipe_stat: {cmd: juggle, key: frozen, equals: 1}
  - assert_pipe_stat: {cmd: juggle, key: burn, min: 100}
  - assert_juggle: {locked: 1}
  - screenshot: fire_out_locked
  - wait_s: 2.5
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 1}
  - assert_pipe_stat: {cmd: juggle, key: frozen, equals: 1}
  - assert_juggle: {locked: 1}
  # the meter cools 0.1/s: from 0.6, below 0.1 after ~5 s -> the game writes again
  - wait_s: 6
  - assert_pipe_stat: {cmd: juggle, key: burn, equals: 0}
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  - assert_pipe_contains: {cmd: juggle, contains: "glyph=- "}
  - assert_juggle: {locked: 0}
  - screenshot: cooled_following
  - assert_log: {contains: "juggle: following"}
  - assert_pipe_stat: {cmd: juggle, key: elsewhere, equals: 0}
  # pass out in the fire: the display follows the observed spot while passed out; the
  # respawn mirrors the checkpoint into the spot, a write the overlay logs as elsewhere
  - console: "fd_dbg_tofire 2"
  - wait_log: {contains: "juggle: tofire: done", timeout: 60}
  - assert_pipe_stat: {cmd: juggle, key: state, equals: 6}
  - wait_s: 0.5
  - assert_juggle: {locked: auto}
  - screenshot: passed_out
  - wait_s: 7
  - assert_pipe_stat: {cmd: juggle, key: state, equals: 3}
  - assert_pipe_stat: {cmd: juggle, key: locked, equals: 0}
  - assert_pipe_contains: {cmd: juggle, contains: "glyph=- "}
  - assert_pipe_stat: {cmd: juggle, key: elsewhere, min: 1}
  - assert_log: {contains: "juggle: spot written elsewhere"}
  - screenshot: respawned
expect:
  no_crash: true
  log_errors: 0
