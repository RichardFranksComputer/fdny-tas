name: checkpoints
# Real native contacts: file loading, native timestamp hint, once-per-attempt and saved toggle.
pre_files:
  - {src: tests/game/data/practice_training.txt, dst: Checkpoints/training.txt}
  - {src: null, dst: FDNYCore.cfg}
  - {src: null, dst: Checkpoints/training.txt.bak}
  - {src: null, dst: Checkpoints/training.txt.tmp}
setup: load_training
record: false
steps:
  - assert_log: {contains: "module checkpoints: enabled"}
  - console: "fd_profile practice"
  - console: "fd_checkpoints 1"
  - wait_log: {contains: "checkpoints: loaded 2 native checkpoints for training", since_console: true, timeout: 10}
  - wait_pipe: {cmd: triggers, key: n, equals: 27, timeout: 10}
  - console: "fd_tp_save"
  - key: {key: w, hold: 2}
  - console: "fd_tp_load"
  - wait_log: {contains: "checkpoint Spawn:", since_console: true, timeout: 5}
  - sample_pipe: {cmd: game_hints, as: hints_priority}
  - console: "hint 4 This must not replace the checkpoint"
  - assert_pipe_stat: {cmd: game_hints, key: suppressed, min: 1, since: hints_priority}
  - assert_pipe_stat: {cmd: game_hints, key: passed, equals: 0, since: hints_priority}
  - screenshot: timestamp_native_priority
  - key: {key: w, hold: 2}
  - console: "fd_tp_load"
  - wait_s: 0.5
  - assert_log_count: {contains: "checkpoint Spawn:", equals: 1}
  - key: {key: n, hold: 0.1}
  - assert_log: {contains: "checkpoints: timestamps off"}
  # With timestamps off the game's own hints show again.
  - sample_pipe: {cmd: game_hints, as: hints_off}
  - console: "hint 4 Game hint"
  - assert_pipe_stat: {cmd: game_hints, key: passed, min: 1, since: hints_off}
  - loadmap: training
  - wait_pipe: {cmd: triggers, key: n, equals: 25, timeout: 10}
  - key: {key: n, hold: 0.1}
  - wait_pipe: {cmd: triggers, key: n, equals: 27, timeout: 10}
  # The N press logs its line before a wait_log could start counting: count both loads.
  - assert_log_count: {contains: "checkpoints: loaded 2 native checkpoints for training", equals: 2}
  # Edit a file without changing live native entities; the next mission load applies it.
  - console: "fd_checkpoints_edit 1"
  - assert_pipe_stat: {cmd: freecam, key: flying, equals: 1}
  - sample_pipe: {cmd: freecam, as: editor_flight}
  - key: {key: w, hold: 0.2}
  - assert_pipe_stat: {cmd: freecam, key: moved, min: 100, since: editor_flight}
  - mouse_rel: [30, 0]
  - assert_pipe_stat: {cmd: freecam, key: turn, min: 10, since: editor_flight}
  - key: {key: ins, hold: 0.1}
  - wait_s: 1
  - assert_file: {path: Checkpoints/training.txt, contains: "Checkpoint A"}
  - console: 'fd_checkpoints_name "Editor test"'
  - key: {key: right, hold: 0.1}
  - key_down: lshift
  - key: {key: pgup, hold: 0.1}
  - key_up: lshift
  - key_down: lctrl
  - key: {key: c, hold: 0.1}
  - key: {key: v, hold: 0.1}
  - key_up: lctrl
  - wait_s: 1
  - assert_file: {path: Checkpoints/training.txt, contains: "FDNY_CHECKPOINTS_V1|training|4"}
  - assert_file: {path: Checkpoints/training.txt, contains: "Checkpoint B"}
  - key: {key: del, hold: 0.1}
  - key: {key: home, hold: 0.1}
  - wait_s: 1
  - assert_file: {path: Checkpoints/training.txt, contains: "FDNY_CHECKPOINTS_V1|training|4"}
  - assert_file: {path: Checkpoints/training.txt, contains: "Checkpoint B"}
  - key: {key: end, hold: 0.1}
  - wait_s: 1
  - assert_file: {path: Checkpoints/training.txt, contains: "FDNY_CHECKPOINTS_V1|training|3"}
  - assert_file: {path: Checkpoints/training.txt, contains: "Editor test"}
  - assert_file: {path: Checkpoints/training.txt.bak, contains: "FDNY_CHECKPOINTS_V1|training|2"}
  - screenshot: checkpoint_editor
  - console: "fd_checkpoints_edit 0"
  - assert_pipe_stat: {cmd: freecam, key: flying, equals: 0}
  - loadmap: training
  - wait_pipe: {cmd: triggers, key: n, equals: 28, timeout: 10}
  # Practice-only (refused in fd_profile run): the gate is profile_run's and keys_default's,
  # the declarations docs_registry's.
expect:
  no_crash: true
  log_errors: 0
