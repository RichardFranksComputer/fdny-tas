name: keys_default
# Owner request 2026-10-22 (D37): every feature has a default letter key, no F keys.
# This test proves the binds: each default key, pressed in a level (game focused,
# console closed), dispatches its command ("bind: <key> -> <command>"), and J's toggle
# really runs (the `toggle <var>` builtin, both ways). What each command then does is
# the feature's own test: juggle fire_juggle, H hud_player, G / B / Z / X glitch_records
# and text_panels, T / Y triggers, K / L tp_teleport, P freecam, V replay. Which key maps to which command
# is checked against the source by docs_registry.
# Narrowed by the suite review (2026-10-24): it used to re-check every feature's effect
# (24 key presses, 22 fixed waits), so a failure didn't say whether the bind or the
# feature broke. Kept here because nothing else covers them: G off and on shows the boxes
# even after a B hide (owner 2026-10-22); FDNYCore.cfg holds only changed binds; a
# practice-only key is refused under fd_profile run.
pre_files:
  - {src: tests/game/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "bindlist"
  - assert_log: {contains: "toggle fd_juggle"}
  - focus: {}
  - wait_s: 1
  # every default bind dispatches; toggles pressed twice to leave things as they were
  - key: {key: j, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "bind: j -> toggle fd_juggle"}
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 1}
  - key: {key: j, hold: 0.1}
  - wait_s: 0.5
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 0}
  - key: {key: h, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: h, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: t, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: t, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: t, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: y, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: y, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: k, hold: 0.1}
  - wait_s: 0.2   # a release the core sees (it polls once per frame)
  - key: {key: l, hold: 0.1}
  - wait_s: 0.5
  - assert_log_count: {contains: "bind: h -> toggle fd_hud_player", equals: 2}   # every press seen
  - assert_log_count: {contains: "bind: t -> fd_triggers_toggle", equals: 3}
  - assert_log_count: {contains: "bind: y -> toggle fd_triggers_all", equals: 2}
  - assert_log: {contains: "bind: k -> fd_tp_save"}
  - assert_log: {contains: "bind: l -> fd_tp_load"}
  - assert_log: {contains: "console> trigger boxes: off"}   # T three times: back to off
  - key: {key: p, hold: 0.1}
  - wait_pipe: {cmd: pause, key: active, equals: 1, timeout: 3}
  - key: {key: p, hold: 0.1}
  - wait_pipe: {cmd: pause, key: active, equals: 0, timeout: 3}
  - assert_log: {contains: "bind: p -> fd_pause_toggle"}
  # G on, B hides the boxes; G off and on again always shows them (owner 2026-10-22)
  - key: {key: g, hold: 0.1}
  - wait_s: 1
  - assert_log: {contains: "bind: g -> toggle fd_hud_warp"}
  - assert_log: {contains: "glitch: hooks installed"}
  - key: {key: b, hold: 0.2}
  - wait_s: 0.3
  - assert_pipe_stat: {cmd: glitch_box, key: hidden, equals: 1}
  - key: {key: g, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "console> fd_hud_warp 0"}
  - key: {key: g, hold: 0.1}
  - wait_s: 1
  - assert_pipe_stat: {cmd: glitch_box, key: hidden, equals: 0}
  - key: {key: g, hold: 0.1}
  - wait_s: 0.5
  # FDNYCore.cfg holds only changes: the variables set above, not the default binds
  # (owner 2026-10-22: every default bind was written out); a changed default is written
  - console: "fd_writeconfig"
  - assert_file: {path: FDNYCore.cfg, absent: "bind j"}
  - assert_file: {path: FDNYCore.cfg, absent: "bind p"}
  - console: 'bind j "toggle fd_hud_player"'
  - assert_file: {path: FDNYCore.cfg, contains: "bind j \"toggle fd_hud_player\""}
  - console: 'bind j "toggle fd_juggle"'
  - assert_file: {path: FDNYCore.cfg, absent: "bind j"}
  - console: "unbind y"
  - assert_file: {path: FDNYCore.cfg, contains: "unbind y"}
  # practice-only keys are refused in run
  - console: "fd_profile run"
  - wait_s: 1
  - key: {key: j, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "profile: refused fd_juggle"}
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 0}
  - console: "fd_profile practice"
expect:
  no_crash: true
  log_errors: 0
