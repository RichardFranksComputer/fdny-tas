name: docs_registry
# D41: the quick reference (docs/quick-reference.md, and each release's) is read from the source by tools/docgen.py.
# This checks that reading against what the Debug build really registered: every variable
# (default, read-only, saved, practice-only, help), command, default bind and
# feature key (binds::DescribeKey), both ways. A registration docgen can't see fails here.
# Also: bindlist shows the feature keys.
pre_files:
  - {src: tests/game/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: null, dst: FDNYCore_registry.txt}
setup: load_training
record: false
steps:
  - console: "fd_dbg_registry"
  - wait_s: 0.5
  - assert_log: {contains: "fd_dbg_registry: wrote"}
  - assert_registry: {file: FDNYCore_registry.txt}
  - assert_log: {contains: "module window: enabled"}
  - console: "bindlist"
  - wait_s: 0.5
  - assert_log: {contains: "b: show / hide the warp HUD's boxes (fd_warp_hide) (while fd_hud_warp is 1; not a bind)"}
  - assert_log: {contains: "w s: free camera: forward / back along the view (while fd_pause is 1; not a bind)"}
expect:
  no_crash: true
  log_errors: 0
