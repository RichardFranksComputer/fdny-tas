name: draw_layers
# gfx draw layers (D40): WORLD is drawn right after the world render and hidden by walls;
# OVERLAY after everything the game draws, over walls; HUD (text panels) last. The test
# box is a Debug hook (fd_dbg_layer_box, magenta). On oil_rig_A at the owner's warehouse
# corner (-921.7 766 247, yaw 45): the exit trigger's column there stands behind both wall
# faces (docs/evidence/trigger_depth, x-ray shot), so a WORLD box at its corners must leave the
# picture unchanged, and an OVERLAY box there must show. A WORLD box in the open just
# ahead must show. The layers' order on a frame comes from the Debug pipe `layers`.
pre_files:
  - {src: tests/game/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - assert_log: {contains: "gfx: ready"}
  - console: "fd_watermark 0"
  - loadmap: oil_rig_A
  - console: "fd_dbg_setpos -921.7 766 247 45"
  - wait_log: {contains: "juggle: setpos -922 766 247 (+yaw): ok", since_console: true, timeout: 10}
  - wait_s: 2
  # paused (fd_pause): the sky, fires and clock stand still, so "nothing changed" can be
  # measured; drawing goes on (run dl1: two unpaused shots of the same view differ by 13)
  - console: "fd_pause 1"
  - wait_pipe: {cmd: pause, key: active, equals: 1, timeout: 3}
  - wait_s: 1
  - screenshot: base
  - assert_pipe_contains: {cmd: layers, contains: "order=world,overlay,hud "}
  # WORLD behind the walls: nothing changes on screen
  - console: "fd_dbg_layer_box world -812 740 356 -696 972 476"
  - wait_s: 1
  - screenshot: world_behind_wall
  - assert_pipe_stat: {cmd: layers, key: boxes, equals: 1}
  - assert_screen_diff: {a: base, b: world_behind_wall, box: [0.38, 0.05, 0.62, 0.6], max: 2}
  # OVERLAY at the same place: over the walls
  - console: "fd_dbg_layer_box overlay -812 740 356 -696 972 476"
  - wait_s: 1
  - screenshot: overlay_behind_wall
  - assert_pipe_stat: {cmd: layers, key: polys, min: 1}
  - assert_screen_diff: {a: base, b: overlay_behind_wall, box: [0.38, 0.05, 0.62, 0.6], min: 20}
  # WORLD in the open, 100 u ahead on the walkway: shows
  - console: "fd_dbg_layer_box world -866 770 301 -836 800 331"
  - wait_s: 1
  - screenshot: world_in_open
  - assert_screen_diff: {a: base, b: world_in_open, min: 1}
  - console: "fd_dbg_layer_box off"
  - wait_s: 1
  - screenshot: box_off
  - assert_pipe_stat: {cmd: layers, key: boxes, equals: 0}
  - assert_screen_diff: {a: base, b: box_off, max: 2}
  - console: "fd_pause 0"
  # the order holds with text panels on (HUD last)
  - console: "fd_hud 1"
  - wait_s: 1
  - assert_pipe_contains: {cmd: layers, contains: "order=world,overlay,hud "}
expect:
  no_crash: true
  log_errors: 0
