name: vars_binds_persist
# Item 5: an archived fd_ variable and a bind set from the console are
# written to FDNYCore.cfg and survive a restart; the bind runs its command on
# a key press in-game, and does not fire while the console is open.
pre_files:
  - {src: tests/game/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: null, dst: autoexec.cfg}
setup: load_training
record: true
steps:
  - assert_log: {contains: "config: startup (FDNYCore.cfg: none, autoexec.cfg: none)"}
  - type: "`"
  - wait_s: 0.3
  - type: "fd_log_commands 0"
  - key: enter
  - type: "bind f5 \"echo bound-f5-ok\""
  - key: enter
  - wait_s: 0.3
  - screenshot: 01_bind_set
  # console open: F5 must not fire
  - key: f5
  - wait_s: 0.3
  - assert_log_count: {contains: "console> bound-f5-ok", equals: 0}
  - type: "`"
  - wait_s: 0.3
  # console closed: F5 fires exactly once per press
  - key: f5
  - wait_s: 0.3
  - assert_log_count: {contains: "console> bound-f5-ok", equals: 1}
  - key: f5
  - wait_s: 0.3
  - assert_log_count: {contains: "console> bound-f5-ok", equals: 2}
  - assert_file: {path: FDNYCore.cfg, contains: "fd_log_commands \"0\""}
  - assert_file: {path: FDNYCore.cfg, contains: "bind f5 \"echo bound-f5-ok\""}
  # restart: settings come back from FDNYCore.cfg
  - restart: {wait_s: 6}
  - assert_log: {contains: "config: startup (FDNYCore.cfg: loaded, autoexec.cfg: none)"}
  # binds act only inside a level (D58): F5 does nothing at the menu
  - key: f5
  - wait_s: 0.5
  - assert_log_count: {contains: "console> bound-f5-ok", equals: 0}
  - assert_log_count: {contains: "cmd: echo bound-f5-ok", equals: 0}
  # console at the splash/menu is refused (game font not loaded yet); check values in a level
  - type: "`"
  - wait_s: 1
  - assert_mem: {name: console.state, equals: 0}
  - click: [320, 240]
  - wait_s: 3
  - run_setup: load_training_from_menu
  # the restored bind fires once in the level
  - key: f5
  - wait_s: 0.5
  - assert_log_count: {contains: "console> bound-f5-ok", equals: 1}
  - assert_log_count: {contains: "cmd: echo bound-f5-ok", equals: 0}
  - type: "`"
  - wait_s: 0.3
  - type: "fd_log_commands"
  - key: enter
  - type: "bindlist"
  - key: enter
  - wait_s: 0.5
  - screenshot: 02_after_restart
  - assert_log: {contains: "console> fd_log_commands is \"0\""}
  - assert_log: {contains: "console> f5 \"echo bound-f5-ok\""}
expect:
  no_crash: true
  log_errors: 0
