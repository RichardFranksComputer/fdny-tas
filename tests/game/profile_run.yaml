name: profile_run
# Item 12: fd_profile run / practice switch variable sets; practice-only
# variables and commands are refused in run; the watermark (in-frame, engine
# font) lists the profile, every non-default FDNYCore variable and the other
# .asi mods, and can't be hidden in run; the profile and the remembered
# practice set survive a restart.
pre_files:
  - {src: tests/game/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: tests/game/data/fdcore_profile.cfg, dst: FDNYCore.cfg}
  - {src: null, dst: profile_run.cfg}
  - {src: null, dst: profile_practice.cfg}
  # The "other .asi" the watermark lists: an inert second core (core_single_instance), since
  # the game folder holds FDNYCore alone (D55).
  - {src: build/Debug/FDNYCore.asi, dst: FDNYCoreZ.asi}
setup: load_training
record: true
steps:
  # practice (default): the practice setting is on and listed
  - assert_pipe_contains: {cmd: watermark, contains: "practice"}
  - assert_pipe_contains: {cmd: watermark, contains: "hud_player 1"}
  - assert_pipe_contains: {cmd: watermark, contains: "asi: FDNYCoreZ"}
  - screenshot: watermark_practice
  # switch to run: practice-only settings go back to default
  - console: "fd_profile run"
  - assert_log: {contains: "profile: run"}
  - console: "fd_hud_player"
  - assert_log: {contains: 'console> fd_hud_player is "0"'}
  - assert_pipe_contains: {cmd: watermark, contains: "RUN"}
  - assert_pipe_contains: {cmd: watermark, absent: "hud_player"}
  # refused in run: variables (console message, value unchanged) and commands
  - console: "fd_hud_player 1"
  - assert_log: {contains: "console> fd_hud_player is practice-only (fd_profile is run)"}
  - console: "fd_hud_warp 1"
  - assert_log: {contains: "console> fd_hud_warp is practice-only (fd_profile is run)"}
  - assert_pipe_stat: {cmd: glitch, key: installed, equals: 0}
  - console: "fd_watermark 0"
  - assert_log: {contains: "console> fd_watermark is practice-only (fd_profile is run)"}
  - console: "fd_warp_clear"
  - assert_log: {contains: "console> fd_warp_clear is practice-only (fd_profile is run)"}
  # the pre-0.19 name is an alias: refused the same way, under the current name
  - console: "fd_glitch_clear"
  - assert_log_count: {contains: "console> fd_warp_clear is practice-only (fd_profile is run)", equals: 2}
  # allowed in run: other settings, shown on the watermark
  - console: "fd_fov 95"
  - assert_pipe_contains: {cmd: watermark, contains: "fov 95"}
  - screenshot: watermark_run
  # the profile + the remembered practice set survive a restart
  - restart: {wait_s: 6}
  - run_setup: load_training
  - assert_pipe_contains: {cmd: watermark, contains: "RUN"}
  - assert_pipe_contains: {cmd: watermark, absent: "hud_player"}
  - assert_pipe_contains: {cmd: watermark, contains: "fov 95"}
  # back to practice: the remembered value returns
  - console: "fd_profile practice"
  - assert_log: {contains: "profile: practice"}
  - console: "fd_hud_player"
  - assert_log: {contains: 'console> fd_hud_player is "1"'}
  - assert_pipe_contains: {cmd: watermark, contains: "hud_player 1"}
  - console: "fd_watermark 0"
  - assert_pipe_contains: {cmd: watermark, contains: "practice"}
expect:
  no_crash: true
  log_errors: 0
