# Builds FDNYCore.asi (Release) from source with the same toolchain as the VM, and
# publishes it as a GitHub release tagged v<VERSION>.
#   - push to main that changes VERSION, or a manual run on main:
#     build, then release v<VERSION> unless that tag already exists (never overwritten);
#   - push to any other branch (a feature branch): build only, uploaded as an
#     artifact, no tag or release.
# The build is build.ps1: arch_check, the address table, -Werror, the quick reference.
# The release's one download is FDNYCore-<VERSION>.zip: the .asi and its quick reference.
# Zig comes from mlugg/setup-zig, the same version as the VM's (environment/local/tools);
# Python only needs its standard library here.
name: release

on:
  push:
    branches: ['**']
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { throw "VERSION is not a version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (Release)
        shell: pwsh
        run: ./build.ps1 -Config Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          # The version in every file name (owner: easy to see at a glance), e.g. FDNYCore-0.18.1.asi
          $v = '${{ steps.version.outputs.version }}'
          $asi = "FDNYCore-$v.asi"
          $out = 'release-out'
          New-Item -ItemType Directory -Force $out | Out-Null
          # The only download is the zip (owner 2026-10-29: a bare .asi gets downloaded without
          # its reference): the .asi and this build's quick reference (quick-reference.md:
          # version, SHA-256, every key / feature / variable / command), the same as the
          # repository's docs/quick-reference.md. The .asi's SHA-256 is in the notes too.
          $pkg = 'package'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item build/Release/FDNYCore.asi $pkg/$asi
          Copy-Item build/Release/quick-reference.md $pkg/quick-reference.md
          Compress-Archive -Path "$pkg/*" -DestinationPath "$out/FDNYCore-$v.zip"
          $sha = (Get-FileHash $pkg/$asi -Algorithm SHA256).Hash.ToLower()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "asi=$asi" >> $env:GITHUB_OUTPUT
          Write-Host "$asi $((Get-Item $pkg/$asi).Length) bytes, sha256 $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: FDNYCore-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: release-out/

      - name: Release v${{ steps.version.outputs.version }}
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already released: nothing to do"; exit 0 }
          # What changed: this version's section of CHANGES.md (docgen.py notes; unit-tested in
          # tests/unit/test_docgen.py). No section = no release: the notes are part of the bump.
          $v = '${{ steps.version.outputs.version }}'
          $changes = (python -I tools/docgen.py notes $v) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "CHANGES.md has no '## $v' section: add the release notes" }
          $notes = @"
          FDNYCore $v, built from ${{ github.sha }} (${{ github.ref_name }}).

          Download ``FDNYCore-$v.zip``: ``${{ steps.package.outputs.asi }}`` + ``quick-reference.md``, the quick reference for this build: every key, feature, variable and command.

          Install: unzip, then copy ``${{ steps.package.outputs.asi }}`` next to ``FDNYFirefighter.exe`` (it loads through Ultimate ASI Loader).
          **Remove any older ``FDNYCore*.asi`` first:** the loader loads every ``.asi`` in the folder; only the first copy of the core runs, and the others stay inert.

          SHA-256: ``${{ steps.package.outputs.sha }}``

          $changes
          "@
          gh release create $tag (Get-ChildItem release-out -File).FullName `
            --target ${{ github.sha }} --title "FDNYCore ${{ steps.version.outputs.version }}" --notes $notes
