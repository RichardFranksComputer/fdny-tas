# Unit tests (tests/unit, D47) on pull requests and pushes to main: the core's pure logic built
# for the host and run without the game (address table, crash log, replay data), plus the
# tools (arch_check rules, docgen, test_check: the game tests in step with the code, D61). The game-driven suite
# (tests/game) still needs the VM.
# Once per change: a push to a PR's branch runs only the pull_request event (push is limited
# to main, where merges land), so a PR no longer runs the tests twice.
name: unit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The same Zig as the VM's (environment/local/tools); on PATH, cached by the action.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Unit tests
        shell: pwsh
        run: ./tests/unit/run.ps1
